name: Deploy to S3 + CloudFront

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  # Set these as repository variables (Settings > Secrets and variables > Actions > Variables)
  # from the infra repo's `terraform output`.
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  SITE_BUCKET: ${{ vars.SITE_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

permissions:
  id-token: write # GitHub OIDC -> AWS, no long-lived access keys
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install and build
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          # Hashed build assets never change, so cache them forever.
          # Old chunks are kept so visitors mid-session don't get 404s.
          aws s3 sync out/_next/static "s3://$SITE_BUCKET/_next/static" \
            --cache-control "public,max-age=31536000,immutable"
          # Everything else (HTML, RSC payloads, public/) must revalidate
          aws s3 sync out "s3://$SITE_BUCKET" --delete \
            --exclude "_next/static/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
